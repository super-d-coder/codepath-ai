server:
  port: 8091

# InfoFlow 外部数据源配置
infoflow:
  github:
    api-base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    lookback-days: 14
    per-page: 30
  hacker-news:
    api-base-url: https://hacker-news.firebaseio.com/v0
    top-story-limit: 30
    connect-timeout-seconds: 15
    request-timeout-seconds: 30
    max-retries: 2
    retry-delay-millis: 1000

# 本地敏感配置，不提交到 Git
step-key:

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size:
        max-pool-size:
        keep-alive-time:
        block-queue-size:
        policy:

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:

  datasource:
    url:
    username:
    password:
    driver-class-name:
    hikari:
      maximum-pool-size:
      minimum-idle:
      connection-timeout:

#     MyBatis 配置【如需使用记得打开】
mybatis:
  mapper-locations:
  config-location:

logging:
  level:
    root:
  config:

test:
  ssh:
    host:
    username:
    password:
    password-encrypted-key:
